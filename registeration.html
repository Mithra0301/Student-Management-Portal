    <h1>Student Registration Form</h1>

    <p>Please fill in the following details to register.</p>

    <form>

        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name"
        placeholder="Enter your name" required><br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob" required><br><br>

        <label>Gender:</label><br>

        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email"
        placeholder="Enter your email" required><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone"
        placeholder="Enter your phone number" required><br><br>

        <label for="course">Select Course:</label><br>

        <select id="course" name="course">
            <option value="">Choose a Course</option>
            <option>Computer Science</option>
            <option>Information Technology</option>
            <option>Electronics</option>
            <option>Mechanical Engineering</option>
        </select><br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address"
        rows="4" cols="30"
        placeholder="Enter your address"></textarea><br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear">

    </form>

</body>

</html>
